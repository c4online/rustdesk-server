name: build

# 说明：
# 1) 本工作流基于官方 rustdesk-server 1.1.14 的 build.yaml，仅做以下必要改动：
#    - 已退役的运行环境 ubuntu-20.04 / windows-2019 分别替换为 ubuntu-22.04 / windows-2022
#    - 已弃用的 actions/upload-artifact@v3、download-artifact@v3 升级为 @v4
#    - 去掉 submodules: recursive（本项目 libs/hbb_common 已内置为普通目录，不是子模块）
# 2) 编译命令与官方一致：--release --all-features，Linux 用 cross 产出 musl 静态二进制。
# 3) 产物：Linux amd64 / arm64v8 / armv7 / i386 与 Windows x64 各自的 hbbs、hbbr、rustdesk-utils。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:

  # ---------------- Linux binaries (musl) ----------------
  build:
    name: Build - ${{ matrix.job.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   target: "x86_64-unknown-linux-musl" }
          - { name: "arm64v8", target: "aarch64-unknown-linux-musl" }
          - { name: "armv7",   target: "armv7-unknown-linux-musleabihf" }
          - { name: "i386",    target: "i686-unknown-linux-musl" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      # 仅Linux平台安装cross，macOS/Windows原生编译不需要cross，节省时间且避免错误
      - name: Install cross (Linux only)
        if: startsWith(matrix.job.os, 'ubuntu')
        run: cargo install cross --locked

      - name: Build binaries
        run: |
          if [[ "${{ matrix.job.os }}" == ubuntu-* ]]; then
            # Linux平台用cross交叉编译
            export CROSS_NO_WARNINGS=0
            cross build --release --all-features --target=${{ matrix.job.target }}
          else
            # macOS/Windows平台直接原生cargo编译
            cargo build --release --all-features --target=${{ matrix.job.target }}
          fi

      # （可选）如果想要和官方一样打包成压缩包+sha256校验，加上这一步
      - name: Package binaries
        run: |
          mkdir -p dist
          if [[ "${{ matrix.job.os }}" == windows-* ]]; then
            # Windows二进制带.exe后缀，打包成zip
            cp target/${{ matrix.job.target }}/release/hbbs.exe dist/
            cp target/${{ matrix.job.target }}/release/hbbr.exe dist/
            cp target/${{ matrix.job.target }}/release/rustdesk-utils.exe dist/
            cd dist
            7z a ../rustdesk-server-${{ matrix.job.target }}.zip *.exe
            cd ..
            certutil -hashfile rustdesk-server-${{ matrix.job.target }}.zip SHA256 > rustdesk-server-${{ matrix.job.target }}.zip.sha256
          else
            # Linux/macOS二进制无后缀，打包成tar.gz
            cp target/${{ matrix.job.target }}/release/hbbs dist/
            cp target/${{ matrix.job.target }}/release/hbbr dist/
            cp target/${{ matrix.job.target }}/release/rustdesk-utils dist/
            chmod +x dist/*
            tar czf rustdesk-server-${{ matrix.job.target }}.tar.gz -C dist .
            sha256sum rustdesk-server-${{ matrix.job.target }}.tar.gz > rustdesk-server-${{ matrix.job.target }}.tar.gz.sha256
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-${{ matrix.job.target }}
          # 如果加了上面的打包步骤，path用下面这行（直接下压缩包）
          path: |
            rustdesk-server-*.tar.gz
            rustdesk-server-*.zip
            rustdesk-server-*.sha256
          # 如果不需要打包，直接传原始二进制，path用下面这行（注意Windows加.exe）
          # path: |
          #   target/${{ matrix.job.target }}/release/hbbs*
          #   target/${{ matrix.job.target }}/release/hbbr*
          #   target/${{ matrix.job.target }}/release/rustdesk-utils*
          if-no-files-found: error


  # ---------------- Windows binaries ----------------
  build-win:
    name: Build - windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build binaries
        run: cargo build --release --all-features --target=x86_64-pc-windows-msvc

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/hbbs.exe
            target/x86_64-pc-windows-msvc/release/hbbr.exe
            target/x86_64-pc-windows-msvc/release/rustdesk-utils.exe
          if-no-files-found: error
