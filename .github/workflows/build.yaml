name: Build and publish to ghcr.io

# ------------- NOTE
# please setup some secrets before running this workflow:
# DOCKER_IMAGE should be the target image name on docker hub (e.g. "rustdesk/rustdesk-server-s6" )
# DOCKER_IMAGE_CLASSIC should be the target image name on docker hub for the old build (e.g. "rustdesk/rustdesk-server" )
# DOCKER_USERNAME is the username you normally use to login at https://hub.docker.com/
# DOCKER_PASSWORD is a token you should create under "account settings / security" with read/write access

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - '*'

jobs:
  build:
    name: ${{ matrix.job.os }} (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu,     use-cross: n }
          - { os: ubuntu-22.04, target: armv7-unknown-linux-gnueabihf, use-cross: y }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu,    use-cross: y }
          - { os: macos-14,     target: aarch64-apple-darwin,         use-cross: n }
          - { os: windows-2022, target: x86_64-pc-windows-msvc,       use-cross: n }
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites (ubuntu)
        if: startsWith(matrix.job.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc g++ pkg-config libssl-dev
          rustup default stable
          rustup target add ${{ matrix.job.target }}

      - name: Install cross
        if: matrix.job.use-cross == 'y'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install prerequisites (macos)
        if: startsWith(matrix.job.os, 'macos')
        run: |
          rustup default stable
          rustup target add ${{ matrix.job.target }}

      - name: Install prerequisites (windows)
        if: startsWith(matrix.job.os, 'windows')
        shell: bash
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add ${{ matrix.job.target }}

      - name: Build (unix)
        if: ${{ !startsWith(matrix.job.os, 'windows') }}
        run: |
          if [ "${{ matrix.job.use-cross }}" = "y" ]; then
            cross build --release --all-features --target=${{ matrix.job.target }}
          else
            cargo build --release --all-features --target=${{ matrix.job.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.job.target }}/release/hbbr dist/hbbr
          cp target/${{ matrix.job.target }}/release/hbbs dist/hbbs
          cp target/${{ matrix.job.target }}/release/rustdesk-utils dist/rustdesk-utils

      - name: Build (windows)
        if: startsWith(matrix.job.os, 'windows')
        shell: bash
        run: |
          cargo build --release --all-features --target=${{ matrix.job.target }}
          mkdir -p dist
          cp target/${{ matrix.job.target }}/release/hbbs.exe dist/hbbs.exe
          cp target/${{ matrix.job.target }}/release/hbbr.exe dist/hbbr.exe
          cp target/${{ matrix.job.target }}/release/rustdesk-utils.exe dist/rustdesk-utils.exe

      - name: Package (unix)
        if: ${{ !startsWith(matrix.job.os, 'windows') }}
        run: |
          cd dist
          tar czf ../rustdesk-server-${{ matrix.job.target }}.tar.gz hbbr hbbs rustdesk-utils
          cd ..
          sha256sum rustdesk-server-${{ matrix.job.target }}.tar.gz > rustdesk-server-${{ matrix.job.target }}.tar.gz.sha256

      - name: Package (windows)
        if: startsWith(matrix.job.os, 'windows')
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath rustdesk-server-${{ matrix.job.target }}.zip -Force
          (Get-FileHash rustdesk-server-${{ matrix.job.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  rustdesk-server-${{ matrix.job.target }}.zip" | Out-File -FilePath rustdesk-server-${{ matrix.job.target }}.zip.sha256 -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-${{ matrix.job.target }}
          path: rustdesk-server-${{ matrix.job.target }}.*

      - name: Log in to GHCR
        if: matrix.job.target == 'x86_64-unknown-linux-gnu' && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        if: matrix.job.target == 'x86_64-unknown-linux-gnu' && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/'))
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest docker/
          docker push ghcr.io/${{ github.repository }}:latest
