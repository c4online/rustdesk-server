name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.job.os }} (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # Linux 三个目标（与之前编译成功时完全一致）
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,       use-cross: n, ext: "" }
          - { os: ubuntu-22.04,   target: armv7-unknown-linux-gnueabihf,  use-cross: y, ext: "" }
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-gnu,      use-cross: y, ext: "" }
          # macOS 两个目标：Intel 用 macos-15-intel，Apple Silicon 用 macos-15
          - { os: macos-15-intel, target: x86_64-apple-darwin,            use-cross: n, ext: "" }
          - { os: macos-15-intel, target: aarch64-apple-darwin,           use-cross: n, ext: "" }
          # Windows
          - { os: windows-2022,   target: x86_64-pc-windows-msvc,         use-cross: n, ext: ".exe" }
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.job.target }}

    - name: Install cross
      if: matrix.job.use-cross == 'y'
      run: cargo install cross --locked

    - name: Build
      shell: bash
      run: |
        if [ "${{ matrix.job.use-cross }}" = "y" ]; then
          cross build --release --all-features --target=${{ matrix.job.target }}
        else
          cargo build --release --all-features --target=${{ matrix.job.target }}
        fi

    - name: Package
      shell: bash
      run: |
        mkdir -p dist
        cp target/${{ matrix.job.target }}/release/hbbs${{ matrix.job.ext }} dist/
        cp target/${{ matrix.job.target }}/release/hbbr${{ matrix.job.ext }} dist/
        cp target/${{ matrix.job.target }}/release/rustdesk-utils${{ matrix.job.ext }} dist/
        cd dist && tar czf ../rustdesk-server-${{ matrix.job.target }}.tar.gz *

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-server-${{ matrix.job.target }}
        path: |
          dist/
          rustdesk-server-${{ matrix.job.target }}.tar.gz

  release:
    name: Github release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        files: artifacts/**/*
