name: Build and publish to ghcr.io

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  build:
    name: ${{ matrix.job.os }} (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-24.04 , target: x86_64-unknown-linux-gnu , use-cross: n , features: "" }
          - { os: ubuntu-24.04 , target: armv7-unknown-linux-gnueabihf , use-cross: y , features: "sqlite-static" }
          - { os: ubuntu-24.04 , target: aarch64-unknown-linux-gnu , use-cross: y , features: "sqlite-static" }
          - { os: macos-15 , target: aarch64-apple-darwin , use-cross: n , features: "" }
          - { os: windows-2022, target: x86_64-pc-windows-msvc   , use-cross: n , features: "" }
    steps:
    - name: Install prerequisites (ubuntu)
      if: startsWith(matrix.job.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get -y install gcc g++ libclang-dev libvpx-dev nasm libxdo-dev libxcb-render-util0-dev libxcb-shape0-dev libxfixes-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev libpulse-dev clang libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libssl-dev libsqlite3-dev
        rustup default stable
        rustup target add ${{ matrix.job.target }}
    - name: Install prerequisites (cross)
      if: matrix.job.use-cross == 'y'
      run: |
        RUSTFLAGS="" cargo install cross --locked
    - name: Install prerequisites (macos)
      if: startsWith(matrix.job.os, 'macos')
      run: |
        brew install libvpx nasm
        rustup default stable
        rustup target add ${{ matrix.job.target }}
    - name: Install prerequisites (windows)
      if: startsWith(matrix.job.os, 'windows')
      run: |
        choco install nasm
        vcpkg integrate install
        vcpkg install libvpx:x64-windows-static-md openssl:x64-windows-static-md
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
        echo "VCPKGRS_DYNAMIC=1" >> $env:GITHUB_ENV
        echo "OPENSSL_NO_VENDOR=1" >> $env:GITHUB_ENV
        rustup default stable-x86_64-pc-windows-msvc
        rustup target add ${{ matrix.job.target }}
    - uses: actions/checkout@v4
    - name: Build (unix)
      if: matrix.job.use-cross == 'y' || startsWith(matrix.job.os, 'macos')
      run: |
        if [ "${{ matrix.job.use-cross }}" = "y" ]
        then
          cross build --release --features "${{ matrix.job.features }}" --target=${{ matrix.job.target }}
        else
          SDKROOT=$(xcrun -sdk macosx --show-sdk-path) MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --release --features "${{ matrix.job.features }}" --target=${{ matrix.job.target }}
        fi
        mkdir -p dist
        cp target/${{ matrix.job.target }}/release/hbbr dist/hbbr
        cp target/${{ matrix.job.target }}/release/hbbs dist/hbbs
        cp target/${{ matrix.job.target }}/release/rustdesk-utils dist/
        if [ "${{ matrix.job.target }}" = "x86_64-unknown-linux-gnu" ]
        then
          strip dist/hbbr dist/hbbs dist/rustdesk-utils
        fi
    - name: Build (windows)
      if: startsWith(matrix.job.os, 'windows')
      run: |
        cargo build --release --features "${{ matrix.job.features }}" --target=${{ matrix.job.target }}
        mkdir -p dist
        cp target/${{ matrix.job.target }}/release/hbbs.exe dist/hbbs.exe
        cp target/${{ matrix.job.target }}/release/hbbr.exe dist/hbbr.exe
        cp target/${{ matrix.job.target }}/release/rustdesk-utils.exe dist/
    - name: Package (unix)
      if: startsWith(matrix.job.os, 'windows') != true
      run: |
        cd dist
        tar czf ../rustdesk-server-${{ matrix.job.target }}.tar.gz hbbr hbbs rustdesk-utils
        cd ..
        sha256sum rustdesk-server-${{ matrix.job.target }}.tar.gz > rustdesk-server-${{ matrix.job.target }}.tar.gz.sha256
    - name: Package (windows)
      if: startsWith(matrix.job.os, 'windows')
      run: |
        Compress-Archive -Path "dist\*" -DestinationPath rustdesk-server-${{ matrix.job.target }}.zip -Force
        (Get-FileHash rustdesk-server-${{ matrix.job.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  rustdesk-server-${{ matrix.job.target }}.zip" | Out-File -FilePath rustdesk-server-${{ matrix.job.target }}.zip.sha256 -Encoding ascii
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-server-${{ matrix.job.target }}
        path: |
          dist/
          rustdesk-server-*