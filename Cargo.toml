[package]
name = "rustdesk-server"
version = "1.1.14"
authors = ["open-trade <open-rustdesk@protonmail.com>"]
edition = "2021"
license = "AGPL-3.0"
description = "RustDesk Server Program"
repository = "https://github.com/rustdesk/rustdesk-server"
homepage = "https://rustdesk.com/"

[dependencies]
hbb_common = { path = "libs/hbb_common" }
clap = "3.0"
serde_derive = "1.0"
serde = "1.0"
toml = "0.5"
dirs = "4.0"
rust-ini = "0.18"
flexi_logger = { version = "0.22", features = ["async", "compress", "specfile_without_age", "wait"] }
signal-hook = "0.3"
sysinfo = { git = "https://github.com/guillaumebeuzeboc/sysinfo", rev = "011dd840" }
confy = { git = "https://github.com/rustdesk/confy", rev = "87f06ad" }
rustls = "0.20"
tokio-rustls = "0.23"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio-socks = "0.5"

[features]
sqlite-static = ["hbb_common/sqlite-static"]

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
name = "rustdesk-utils"
path = "src/utils.rs"

[workspace]
members = ["libs/hbb_common"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.sqlx-macros]
opt-level = 1
codegen-units = 16

[profile.dev]
opt-level = 0
debug = 1
