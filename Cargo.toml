[package]
name = "rustdesk-server"
version = "1.1.14"
authors = ["Open-trade <open-trade@proton.me>"]
edition = "2021"
description = "RustDesk server for rustdesk-api"
license = "AGPL-3.0"
repository = "https://github.com/c4online/rustdesk-server"

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
name = "hbbs"
path = "src/hbbs.rs"

[[bin]]
name = "rustdesk-utils"
path = "src/rustdesk-utils.rs"

[dependencies]
hbb_common = { path = "libs/hbb_common" }
env_logger = "0.9"
flexi_logger = "0.22"
bcrypt = "0.13"
clap = { version = "3.0", features = ["derive"] }
chrono = "0.4"
tokio = { version = "1.10", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.4", features = ["all"] }
toml = "0.5"
jsonwebtoken = "8.1"
base64 = "0.13"
url = "2.2"
uuid = { version = "1.0", features = ["v4"] }
bytes = "1"
async-trait = "0.1"
machine-uid = "0.2"
tokio-tungstenite = { version = "0.17", features = ["native-tls"] }
rustls = "0.20"
rustls-pemfile = "1"
axum = { version = "0.5", features = ["ws", "json"] }
tower-http = { version = "0.3", features = ["cors", "trace"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "native-tls"], default-features = false, git = "https://github.com/mostlikelee/reqwest", branch = "fix-proxy" }
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit", rev = "f89f702a" }
confy = { git = "https://github.com/rustdesk/confy", rev = "87f06ad" }
sysinfo = "0.26"
tokio-socks = { git = "https://github.com/mostlikelee/tokio-socks", rev = "dce4b53" }
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "json", "offline"] }
local-ip-address = "0.4"
sys-locale = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
lto = false
codegen-units = 16

[profile.release.build-override]
opt-level = 1
lto = false
codegen-units = 16

[profile.release.package.sqlx-macros]
opt-level = 1
lto = false
codegen-units = 16
