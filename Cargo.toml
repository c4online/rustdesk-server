[package]
name = "hbbs"
version = "1.1.14"
authors = ["rustdesk <dev@rustdesk.com>"]
edition = "2021"

[dependencies]
hbb_common = { path = "libs/hbb_common", features = ["flatbuffers"] }
serde_derive = "1.0"
serde = "1.0"
toml = "0.5"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
rust-ini = "0.18"
systemstat = "0.2"
socket2 = "0.5"
sysinfo = { git = "https://github.com/rustdesk-org/sysinfo.git", rev = "790c4e4", default-features = false }
confy = { git = "https://github.com/rustdesk-org/confy.git", rev = "87f06ad", default-features = false }
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit.git", rev = "3e6fbb7" }
tokio-socks = { git = "https://github.com/rustdesk-org/tokio-socks.git", rev = "dce4b53" }
machine-uid = { git = "https://github.com/rustdesk-org/machine-uid.git", rev = "b8a72f3", default-features = false }
default-net = { git = "https://github.com/rustdesk-org/default_net.git", rev = "ab50d0c", default-features = false }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "blocking", "brotli", "trust-dns"], git = "https://github.com/rustdesk-org/reqwest", branch = "fix-proxy" }
brotli = "3.4"
once_cell = "1.17"
base64 = "0.21"
flexi_logger = { version = "0.25", default-features = false, features = ["async", "colors", "compress", "syslog", "specfile_without_notification", "textfilter", "use_chrono_for_offset"] }
chrono = "0.4"
tar = "0.4"
flate2 = "1.0"
zstd = "0.12"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
serde_json = "1.0"
regex = "1.7"
lazy_static = "1.4"
socketioxide = { version = "0.9.0", features = ["extensions", "msgpack", "state", "hyper-v1"] }
engineioxide = { version = "0.9.0", features = ["hyper-v1"] }
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1.3", features = ["full"] }
http-body-util = "0.1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
bytes = "1.5"
url = "2.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 单独给sqlx-macros调整编译参数，解决Windows下DLL初始化失败（os error 1114）
# 这是过程宏，仅编译期运行，不需要主程序的极致优化，不影响最终二进制性能
[profile.release.package.sqlx-macros]
opt-level = 1
lto = false
codegen-units = 16
panic = "unwind"
incremental = true

[workspace]
members = ["libs/hbb_common"]

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
name = "hbbs"
path = "src/main.rs"

[[bin]]
name = "rustdesk-utils"
path = "src/utils.rs"
